name: JurisFlow checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, architecture/national-foundation]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Generate lockfile if missing
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts --no-audit --no-fund; fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run regression tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Commit generated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/architecture/national-foundation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f package-lock.json ] && ! git ls-tree -r HEAD --name-only | grep -qx 'package-lock.json'; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/package-lock.json" \
              -f message='chore: lock npm dependency tree' \
              -f content="$(base64 -w0 package-lock.json)" \
              -f branch="$GITHUB_REF_NAME"
          fi
