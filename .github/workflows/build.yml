name: Verificar JurisFlow
on:
  push:
    branches: [main, architecture/national-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Instalar dependencias
        run: npm install
      - name: Ejecutar pruebas de regresión
        run: npm test
      - name: Comprobar compilación
        run: npm run build
